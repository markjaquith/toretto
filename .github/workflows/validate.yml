name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:spacemouse
      - run: npm run build
      - name: Run SpaceMouse browser tests
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4178 --strictPort > "$RUNNER_TEMP/toretto-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4178/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/toretto-vite.log"
            exit 1
          fi
          npm run test:spacemouse:browser
